<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>

    <linearGradient id="logoBoxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <linearGradient id="logoBoxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <linearGradient id="logoBoxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115E59" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#042F2E" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#logoBg)" filter="url(#logoShadow)" />
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#5EEAD4" stroke-width="3" opacity="0.45" />

  <!-- Isometric Package Icon -->
  <g transform="translate(128, 48)">
    <!-- Top Face -->
    <polygon points="0,15 76,55 0,95 -76,55" fill="url(#logoBoxTop)" />

    <!-- Packaging Tape -->
    <polygon points="0,15 14,22 -28,78 -42,71" fill="url(#tapeGrad)" opacity="0.95" />

    <!-- Left Face -->
    <polygon points="-76,55 0,95 0,175 -76,135" fill="url(#logoBoxFront)" />

    <!-- Right Face -->
    <polygon points="0,95 76,55 76,135 0,175" fill="url(#logoBoxSide)" />

    <!-- Barcode Stencil on Left Face -->
    <g transform="translate(-56, 95) skewY(26)">
      <rect x="0" y="0" width="3" height="24" fill="#CCFBF1" opacity="0.8" />
      <rect x="5" y="0" width="2" height="24" fill="#CCFBF1" opacity="0.8" />
      <rect x="9" y="0" width="4" height="24" fill="#CCFBF1" opacity="0.8" />
      <rect x="15" y="0" width="2" height="24" fill="#CCFBF1" opacity="0.8" />
      <rect x="19" y="0" width="5" height="24" fill="#CCFBF1" opacity="0.8" />
      <rect x="26" y="0" width="3" height="24" fill="#CCFBF1" opacity="0.8" />
    </g>

    <!-- Up-Arrows on Right Face -->
    <g transform="translate(26, 90) skewY(-26)" fill="#FEF08A" opacity="0.85">
      <path d="M 6 14 L 6 6 L 3 6 L 9 0 L 15 6 L 12 6 L 12 14 Z" />
      <path d="M 18 14 L 18 6 L 15 6 L 21 0 L 27 6 L 24 6 L 24 14 Z" />
    </g>

    <!-- Scanning Red Laser Line -->
    <line x1="-86" y1="95" x2="86" y2="95" stroke="#F43F5E" stroke-width="3" opacity="0.9" />
    <line x1="-86" y1="95" x2="86" y2="95" stroke="#FFFFFF" stroke-width="1.2" opacity="0.95" />

    <!-- Verified Checkmark Badge -->
    <g transform="translate(42, 10)">
      <circle cx="20" cy="20" r="22" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M 12 20 L 18 26 L 29 14" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
